[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kipp-cia"
version = "0.1.0"
description = "Pustaka prompt, skill, dan alur kerja akademik kolaboratif KIPP"
requires-python = ">=3.11"
dependencies = ["streamlit>=1.35", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
bot = ["aiogram>=3.0", "httpx>=0.27", "python-dotenv>=1.0"]

[tool.setuptools.packages.find]
include = ["kipp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
